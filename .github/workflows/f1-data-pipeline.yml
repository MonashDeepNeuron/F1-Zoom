name: F1 Data Pipeline

on:
  schedule:
    # Every 2 hours, every day — F1 sessions can fall on any day of the week
    # FastF1 data is usually available ~1-2 h after session ends
    - cron: "0 */2 * * *"
  workflow_dispatch:
    # Manual trigger from the GitHub Actions UI

jobs:
  fetch-session-data:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            data_pipeline/requirements.txt
            Data/Simulation/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r data_pipeline/requirements.txt

      - name: Run orchestrator
        run: python -m data_pipeline.orchestrator

      - name: Install prediction model dependencies
        run: pip install -r Data/Simulation/requirements.txt

      - name: Run prediction model
        run: python Data/Simulation/lightgbm_model.py --from-supabase --auto
