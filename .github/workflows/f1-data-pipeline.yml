name: F1 Data Pipeline

on:
  schedule:
    # Every 2 hours on Thu–Sun (race weekend days, UTC)
    # FastF1 data is usually available ~1-2 h after session ends
    - cron: "0 */2 * * 4-0"
  workflow_dispatch:
    # Manual trigger from the GitHub Actions UI

jobs:
  fetch-session-data:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: data_pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r data_pipeline/requirements.txt

      - name: Run orchestrator
        run: python -m data_pipeline.orchestrator
